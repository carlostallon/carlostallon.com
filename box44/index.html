<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Box44 Training Calendar</title>
    <meta
      name="description"
      content="Calendario semanal de rutinas Box44 con rotación y selección de entrenos."
    />
    <link rel="canonical" href="https://carlostallon.com/box44/" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="controls surface-card" aria-labelledby="filters-title">
        <div class="controls-header">
          <div>
            <h2 id="filters-title">Rutinas</h2>
            <p class="section-copy">
              Activa las clases a las que quieres ir para ver rápidamente qué
              días te tocan esta semana.
            </p>
          </div>
          <button id="clear-selection" class="ghost-button" type="button">
            Limpiar selección
          </button>
        </div>

        <div id="routine-filters" class="filter-grid" aria-live="polite"></div>
      </section>

      <section class="calendar-panel surface-card" aria-labelledby="calendar-title">
        <div class="calendar-header">
          <div>
            <h2 id="calendar-title">Calendario semanal</h2>
            <p class="section-copy">
              La vista muestra una semana completa de lunes a domingo. Si hoy es
              domingo, se abre directamente la siguiente semana.
            </p>
          </div>

          <div class="calendar-toolbar">
            <div class="month-selector" aria-label="Selector de semana">
              <button id="previous-week" class="ghost-button month-nav-button" type="button">
                Anterior
              </button>
              <div id="visible-week-label" class="month-label" aria-live="polite">
                Semana actual
              </div>
              <button id="next-week" class="ghost-button month-nav-button" type="button">
                Siguiente
              </button>
            </div>

            <div class="legend">
              <span class="legend-item">
                <span class="legend-swatch legend-swatch-selected"></span>
                Seleccionada
              </span>
              <span class="legend-item">
                <span class="legend-swatch legend-swatch-today"></span>
                Hoy
              </span>
            </div>
          </div>
        </div>

        <div class="month-frame">
          <div class="weekday-row" aria-hidden="true">
            <span>Lun</span>
            <span>Mar</span>
            <span>Mié</span>
            <span>Jue</span>
            <span>Vie</span>
            <span>Sáb</span>
            <span>Dom</span>
          </div>

          <div id="calendar-grid" class="calendar-grid"></div>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
